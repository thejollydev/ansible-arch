---
- name: Install DisplayLink packages
  become: false
  kewlfft.aur.aur:
    name:
      - displaylink
      - evdi-dkms
    state: present
    use: paru
  when: displaylink | bool

# Sound Open Firmware: the audio DSP on recent Intel laptops stays silent
# without it. Harmless where the hardware is absent.
- name: Install sound firmware
  community.general.pacman:
    name: sof-firmware
    state: present

- name: Install iOS integration packages
  community.general.pacman:
    name:
      - ifuse
      - usbmuxd
    state: present
  when: ios_tools | bool

- name: Install Plymouth boot splash
  community.general.pacman:
    name:
      - breeze-plymouth
      - plymouth-kcm
    state: present
  when: plymouth | bool
