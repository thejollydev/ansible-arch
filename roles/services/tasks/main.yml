---
# ------------------------------------------------------------
# Core system services (always)
# ------------------------------------------------------------

- name: Enable core system services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - NetworkManager
    - NetworkManager-dispatcher
    - avahi-daemon
    - docker
    - plasmalogin
    - reflector.timer
    - systemd-resolved
    - systemd-timesyncd

- name: Enable prometheus-node-exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started
  when: node_exporter | bool

- name: Enable btrfs snapshot services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - snapper-timeline.timer
    - snapper-cleanup.timer
  when: btrfs | bool

- name: Enable refind-btrfs service
  ansible.builtin.systemd:
    name: refind-btrfs
    enabled: true
    state: started
  when: bootloader == 'refind' and btrfs | bool

# ------------------------------------------------------------
# Conditional system services
# ------------------------------------------------------------

- name: Enable bluetooth service
  ansible.builtin.systemd:
    name: bluetooth
    enabled: true
    state: started
  when: bluetooth | bool

- name: Enable printing services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - cups
    - cups.path
    - cups.socket
  when: printing | bool

- name: Enable DisplayLink service
  ansible.builtin.systemd:
    name: displaylink
    enabled: true
    state: started
  when: displaylink | bool

- name: Enable NVIDIA sleep services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - nvidia-hibernate
    - nvidia-resume
    - nvidia-suspend
    - nvidia-suspend-then-hibernate
  when: gpu_nvidia | bool

- name: Enable XRDP service
  ansible.builtin.systemd:
    name: xrdp
    enabled: true
    state: started
  when: remote_desktop | bool

# ------------------------------------------------------------
# User services (always)
# ------------------------------------------------------------

- name: Enable user services
  become: false
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    scope: user
  loop:
    - pipewire
    - pipewire-pulse
    - wireplumber
    - ssh-agent
    - obsidian-http-mcp
    - xdg-user-dirs

# ------------------------------------------------------------
# Post-run manual steps
# ------------------------------------------------------------

- name: Write post-run checklist
  become: false
  ansible.builtin.copy:
    dest: /home/joseph/POST-INSTALL.md
    mode: '0644'
    content: |
      # Post-Install Manual Steps

      These steps require interactive login or GUI access and could not
      be automated by Ansible. Complete them in order.

      ## 1. Reboot
      Apply kernel, zram, and systemd changes:
      ```
      sudo reboot
      ```

      ## 2. Insync — Google Drive Sync
      - Open Insync from the application menu
      - Sign in with your Google account
      - Set sync target to `~/GoogleDrive/`
      - Wait for the Obsidian vault to finish syncing

      ## 3. Obsidian — Enable Local REST API Plugin
      - Open Obsidian and select the **Master-Mind** vault
      - Settings → Community Plugins → Enable **Local REST API**
      - Copy the API key from Local REST API plugin settings
      - Verify: `curl http://localhost:27123`
      - Run setup: `obsidian-http-mcp --setup` (paste the API key when prompted)
      - Restart the MCP bridge: `systemctl --user restart obsidian-http-mcp`
      - Verify bridge: `curl http://localhost:3000/mcp` (should return MCP response)

      ## 4. Claude Code — Authenticate and Register MCP
      ```
      claude login
      claude mcp add obsidian-http -s user --transport http http://localhost:3000/mcp
      ```

      ## 5. Printer — Canon TR4700 Setup
      KDE Plasma's printer utility does NOT work for this printer.
      Use the CUPS web interface instead:
      1. Open `http://localhost:631/admin`
      2. Log in as **root**
      3. Click **Add Printer**
      4. Select the discovered **Canon TR4700 series**
      5. Choose **IPP Everywhere** as the driver
      6. Finish the wizard

      ## 6. AI Tools — Authenticate

      The `ai-tools` role installs these but deliberately does NOT log them
      in. Driving a vendor's authenticated client from a script is a terms
      problem, not just an inconvenience — so every login below is yours.

      ### 6a. Antigravity CLI
      ```
      agy
      ```
      First launch opens a browser. Sign in with the account carrying
      **Google AI Pro** — that is the plan the CLI rides. The credential is
      stored in the OS keyring, not in `~/.gemini`, so it survives a wipe of
      that directory and a re-install will appear already signed in. That is
      expected, not stale state.

      ### 6b. Codex CLI
      ```
      codex
      ```
      Authenticate with the ChatGPT plan (Plus/Pro/Team) or an API key.

      ### 6c. Antigravity 2.0 and Antigravity IDE
      Launch each once from the application menu to complete first-run setup.
      Two are separate products: **2.0** is an agent-orchestration dashboard
      with no code editor; the **IDE** is the editor.

      Known cosmetic gap: Antigravity 2.0 ships no icon file (its icon lives
      inside `resources/app.asar`), so its launcher shows a generic icon.

      If either fails to start with a `SUID sandbox helper` error, the kernel's
      unprivileged user namespaces are disabled. Fix:
      ```
      sudo sysctl -w kernel.unprivileged_userns_clone=1
      ```
      Make it permanent in `/etc/sysctl.d/` — NOT `/etc/sysctl.conf`, which
      modern systemd does not apply at boot.

      ## 7. Throughlin — Register the MCP Servers

      This is what joins the tools to one line. Each command PRINTS a config
      block; paste it into that tool's own MCP config.

      ```
      thru mcp register --for claude-code
      thru mcp register --for codex
      thru mcp register --for antigravity
      ```

      Antigravity's config lives at `~/.gemini/config/mcp_config.json`
      (global) or `.agents/mcp_config.json` (per workspace).

      A server with no declared lane serves reads and refuses writes, so
      registration is what makes a tool able to write back to the line.

      ---
      *Generated by ansible-arch. Delete this file after completing all steps.*

- name: Post-run checklist location
  ansible.builtin.debug:
    msg: "Post-install checklist written to ~/POST-INSTALL.md"
