---
- name: Install development tools
  community.general.pacman:
    name:
      - git
      - github-cli
      - glab
      - tea
      - docker
      - docker-compose
      - docker-buildx
      - go
      - nodejs
      - npm
      - yarn
      - python-pip
      - python-poetry
      - python-virtualenv
      - uv
      - mise   # the zsh dotfiles package runs "mise activate" at every shell start
      - terraform
      - bat
      - btop
      - htop
      - duf
      - dust
      - eza
      - fd
      - fzf
      - fastfetch
      - hyperfine
      - procs
      - tokei
      - bind
      - dbeaver
      - ollama
    state: present

- name: Install prometheus-node-exporter
  community.general.pacman:
    name: prometheus-node-exporter
    state: present
  when: node_exporter | bool

- name: Add the workstation user to the docker group
  ansible.builtin.user:
    name: "{{ workstation_user }}"
    groups: docker
    append: true

# ------------------------------------------------------------
# Global npm packages
# ------------------------------------------------------------

# Removed 2026-09-25: Gemini CLI (retired for personal accounts) and
# obsidian-http-mcp (no agent uses it). Codex is installed by ai-tools.
- name: Remove retired global npm packages
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: absent
  loop:
    - obsidian-http-mcp
    - "@google/gemini-cli"
