---
# ============================================================
# base role — system packages, AUR helper, locale, hostname,
#             kernels, bootloader, btrfs, snapper, zram
# ============================================================

# ------------------------------------------------------------
# Full system upgrade (required on Arch — partial upgrades break dependencies)
# ------------------------------------------------------------

# Refreshing the sync databases alone reports `changed`, which made this task
# changed on every run. Count it as a change only when packages moved.
- name: Full system upgrade
  community.general.pacman:
    update_cache: true
    upgrade: true
  register: base_upgrade
  changed_when: base_upgrade.packages | default([]) | length > 0

# ------------------------------------------------------------
# Pacman configuration
# ------------------------------------------------------------

- name: Enable parallel downloads in pacman
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^#ParallelDownloads'
    line: 'ParallelDownloads = 5'

- name: Enable Color in pacman
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^#Color'
    line: 'Color'

# ------------------------------------------------------------
# Core system packages
# ------------------------------------------------------------

- name: Install base system packages
  community.general.pacman:
    name:
      - base-devel
      - sudo
      - git
      - curl
      - wget
      - rsync
      - unzip
      - zip
      - tree
      - nano
      - less
      - ntfs-3g
      - vim
      - stow
      - reflector
      - inotify-tools
      - smartmontools
      - dkms
      - zram-generator
      - efibootmgr
      - dosfstools   # fsck.fat for the EFI partition; nothing else pulls it in
      - imagemagick
    state: present

# ------------------------------------------------------------
# Kernels and firmware
# ------------------------------------------------------------

- name: Install kernels
  community.general.pacman:
    name: "{{ kernels }}"
    state: present

- name: Install microcode and firmware
  community.general.pacman:
    name:
      - intel-ucode
      - linux-firmware
    state: present

    # ------------------------------------------------------------
# Passwordless sudo for pacman (required for paru/AUR installs)
# ------------------------------------------------------------
#
# WHY THIS IS DEFENSIBLE FOR BOOTSTRAP (reviewed 2026-08-02):
#
# This grant is scoped to /usr/bin/pacman only -- not blanket NOPASSWD -- and it
# exists because paru shells out to pacman to install what it has just built. An
# unattended run cannot answer a password prompt, so without this the whole
# apps-aur layer stops dead partway through a rebuild.
#
# It is NOT a security control and must not be mistaken for one: anyone who can
# run pacman as root can install an arbitrary package, which is root. The grant
# does not WIDEN the trust boundary though -- it only removes an interactive
# prompt in front of a decision the operator (the sole user of this laptop) has
# already made by invoking the playbook. The real checkpoint against a hostile
# PKGBUILD is paru's PKGBUILD review step, which is ON by default and which we
# deliberately keep on below -- see the paru.conf block.
#
# If this laptop ever gains a second non-admin user, or the playbook is ever run
# from a source other than Joseph's own workstation, revisit this: the honest
# alternative is prompting once with --ask-become-pass and dropping this file.
#
# Same reasoning covers the `makepkg -si --noconfirm` in the paru bootstrap task
# below -- there is no paru yet at that point, so that one build is necessarily
# unreviewed. It is pinned to the official AUR paru repo and happens exactly
# once, before any other AUR package exists on the box.

- name: Allow the workstation user passwordless sudo for pacman
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ workstation_user }}-pacman"
    content: "{{ workstation_user }} ALL=(ALL) NOPASSWD: /usr/bin/pacman\n"
    mode: '0440'
    validate: 'visudo -cf %s'


# ------------------------------------------------------------
# AUR helper — paru
# ------------------------------------------------------------

- name: Check if paru is installed
  ansible.builtin.command: which paru
  register: base_paru_check
  changed_when: false
  failed_when: false

# Unpinned on purpose: this only runs when paru is missing, and the current
# PKGBUILD is the one to build. paru then updates itself like any AUR package.
- name: Clone paru from AUR  # noqa: latest[git]
  become: false
  ansible.builtin.git:
    repo: https://aur.archlinux.org/paru.git
    dest: /tmp/paru
    depth: 1
  when: base_paru_check.rc != 0

- name: Build and install paru
  become: false
  ansible.builtin.command:
    cmd: makepkg -si --noconfirm
    chdir: /tmp/paru
    creates: /usr/bin/paru
  when: base_paru_check.rc != 0


# ------------------------------------------------------------
# paru supply-chain hardening (2026-08-02)
# ------------------------------------------------------------
#
# Context: the June 2026 AUR incident (Arch advisory 2026-06-12) worked by
# ADOPTING orphaned AUR packages and adding build-time hooks. Arch's own
# guidance was to review every PKGBUILD and .install diff before upgrading.
#
# paru reviews PKGBUILDs BY DEFAULT. The opt-out is `SkipReview`, so the thing
# that actually guarantees the checkpoint is the ABSENCE of that option -- which
# is why the task below asserts it is absent rather than asserting some positive
# flag is present. Assert the mechanism, not the artifact.

- name: Ensure paru PKGBUILD review is NOT disabled
  ansible.builtin.lineinfile:
    path: /etc/paru.conf
    regexp: '^\s*SkipReview\s*$'
    state: absent

- name: Enable paru security-relevant options
  ansible.builtin.lineinfile:
    path: /etc/paru.conf
    line: "{{ item }}"
    insertafter: '^\[options\]'
    state: present
  loop:
    # Prints new Arch news during sysupgrade. The 2026-06-12 "Active AUR
    # malicious packages incident" advisory would have surfaced here
    # automatically, before the upgrade ran, not weeks later.
    - NewsOnUpgrade
    # Detailed upgrade list with the ability to skip individual packages --
    # makes an unexpected package appearing in an upgrade set visible.
    - UpgradeMenu


# ------------------------------------------------------------
# Locale
# ------------------------------------------------------------

- name: Set locale in locale.gen
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*{{ locale }} UTF-8'
    line: '{{ locale }} UTF-8'

- name: Generate locale
  ansible.builtin.command: locale-gen
  changed_when: false

- name: Set system locale
  ansible.builtin.copy:
    dest: /etc/locale.conf
    content: "LANG={{ locale }}\n"
    mode: '0644'

- name: Set vconsole keymap
  ansible.builtin.copy:
    dest: /etc/vconsole.conf
    content: "KEYMAP=us\n"
    mode: '0644'

# ------------------------------------------------------------
# Timezone
# ------------------------------------------------------------

- name: Set timezone
  ansible.builtin.file:
    src: /usr/share/zoneinfo/{{ timezone }}
    dest: /etc/localtime
    state: link
    force: true

- name: Sync hardware clock
  ansible.builtin.command: hwclock --systohc
  changed_when: false

# ------------------------------------------------------------
# Hostname
# ------------------------------------------------------------

- name: Set hostname
  ansible.builtin.copy:
    dest: /etc/hostname
    content: "{{ hostname }}\n"
    mode: '0644'

- name: Set /etc/hosts
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    mode: '0644'

# ------------------------------------------------------------
# Bootloader
# ------------------------------------------------------------

# GRUB loads the kernels from /boot inside the btrfs root, so a snapshot
# carries the kernel that matches it and grub-btrfs can boot it. That needs
# /boot to be a directory on the root filesystem and the EFI partition
# mounted at /efi.
#
# What this role does NOT do: grub-install and efibootmgr. Anything that
# writes the EFI partition or the firmware's boot entries is a manual step,
# listed in ~/POST-INSTALL.md.

- name: Install GRUB
  community.general.pacman:
    name:
      - grub
    state: present
  when: bootloader == 'grub'

- name: Install os-prober (other operating systems in the GRUB menu)
  community.general.pacman:
    name: os-prober
    state: present
  when: bootloader == 'grub' and grub_os_prober | bool

- name: Install grub-btrfs (snapshot entries in the GRUB menu)
  community.general.pacman:
    name:
      - grub-btrfs
      - inotify-tools
    state: present
  notify: Regenerate GRUB menu
  when: bootloader == 'grub' and btrfs | bool

- name: Set the kernel command line for GRUB
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^#?GRUB_CMDLINE_LINUX_DEFAULT='
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="{{ grub_cmdline_default }}"'
  notify: Regenerate GRUB menu
  when: bootloader == 'grub'

- name: Put the default kernel at the top of the GRUB menu
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^#?GRUB_TOP_LEVEL='
    line: 'GRUB_TOP_LEVEL="/boot/vmlinuz-{{ grub_default_kernel }}"'
    insertafter: '^GRUB_DISTRIBUTOR='
  notify: Regenerate GRUB menu
  when: bootloader == 'grub'

- name: Let GRUB look for other operating systems
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^#?GRUB_DISABLE_OS_PROBER='
    line: >-
      GRUB_DISABLE_OS_PROBER={{ 'false' if grub_os_prober | bool else 'true' }}
  notify: Regenerate GRUB menu
  when: bootloader == 'grub'

# A 15_uki script makes GRUB list every unified kernel image it finds in
# EFI/Linux, each under the same name. This setup boots image files, so the
# script is switched off where it exists. The grub package does not ship it,
# so a fresh machine has none and there is nothing to do.
- name: Look for a unified kernel image script in grub.d
  ansible.builtin.stat:
    path: /etc/grub.d/15_uki
  register: base_grub_uki
  when: bootloader == 'grub'

- name: Keep unified kernel images out of the GRUB menu
  ansible.builtin.file:
    path: /etc/grub.d/15_uki
    mode: '0644'
  notify: Regenerate GRUB menu
  when: bootloader == 'grub' and base_grub_uki.stat.exists

- name: Build image files, not unified kernel images
  ansible.builtin.template:
    src: mkinitcpio.preset.j2
    dest: "/etc/mkinitcpio.d/{{ item }}.preset"
    mode: '0644'
  loop: "{{ kernels | reject('search', '-headers$') | list }}"
  notify: Rebuild initramfs images
  when: bootloader == 'grub'

# The hook acts only when the root being booted is a read-only snapshot: it
# puts a writable layer in memory over it. On a normal boot it does nothing.
- name: Let a read-only snapshot boot (grub-btrfs-overlayfs hook)
  ansible.builtin.replace:
    path: /etc/mkinitcpio.conf
    regexp: '^(HOOKS=\((?!.*grub-btrfs-overlayfs).*)\)$'
    replace: '\1 grub-btrfs-overlayfs)'
  notify: Rebuild initramfs images
  when: bootloader == 'grub' and btrfs | bool

# ------------------------------------------------------------
# btrfs tools and snapper (btrfs only)
# ------------------------------------------------------------

- name: Install btrfs packages
  community.general.pacman:
    name:
      - btrfs-progs
    state: present
  when: btrfs | bool

- name: Install snapper
  community.general.pacman:
    name: snapper
    state: present
  when: btrfs | bool

# Without a root configuration there is no /.snapshots, snapper's timers have
# nothing to do, and grub-btrfsd fails at every start. Runs once: an existing
# configuration, and whatever limits were set in it, are left alone.
- name: Create the snapper configuration for the root filesystem
  ansible.builtin.command:
    cmd: snapper -c root create-config /
    creates: /etc/snapper/configs/root
  when: btrfs | bool

# ------------------------------------------------------------
# zram swap
# ------------------------------------------------------------

- name: Configure zram-generator
  ansible.builtin.copy:
    dest: /etc/systemd/zram-generator.conf
    content: |
      [zram0]
      zram-size = ram / 2
      compression-algorithm = zstd
    mode: '0644'

# ------------------------------------------------------------
# reflector (mirror list)
# ------------------------------------------------------------

- name: Configure reflector
  ansible.builtin.copy:
    dest: /etc/xdg/reflector/reflector.conf
    content: |
      --save /etc/pacman.d/mirrorlist
      --country US
      --protocol https
      --latest 25
      --sort rate
    mode: '0644'

# ------------------------------------------------------------
# Enable the multilib repository in pacman.conf
# ------------------------------------------------------------
# exclusive: false, so only this one Include line is managed. pacman.conf has
# no end-of-section marker: an Include line that a package appends to the end
# of the file sits "inside" [multilib] as far as an INI parser can tell, and
# the default (exclusive) deleted it as a duplicate option on every apply.
- name: Enable the multilib repository in pacman.conf
  community.general.ini_file:
    path: /etc/pacman.conf
    state: present
    section: multilib
    option: Include
    value: /etc/pacman.d/mirrorlist
    exclusive: false
    no_extra_spaces: true
    mode: '0644'
  become: true

- name: Update pacman cache
  community.general.pacman:
    update_cache: true
  become: true
