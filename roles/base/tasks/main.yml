---
# ============================================================
# base role — system packages, AUR helper, locale, hostname,
#             kernels, bootloader, btrfs, snapper, zram
# ============================================================

# ------------------------------------------------------------
# Full system upgrade (required on Arch — partial upgrades break dependencies)
# ------------------------------------------------------------

- name: Full system upgrade
  community.general.pacman:
    update_cache: true
    upgrade: true

# ------------------------------------------------------------
# Pacman configuration
# ------------------------------------------------------------

- name: Enable parallel downloads in pacman
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^#ParallelDownloads'
    line: 'ParallelDownloads = 5'

- name: Enable Color in pacman
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^#Color'
    line: 'Color'

# ------------------------------------------------------------
# Core system packages
# ------------------------------------------------------------

- name: Install base system packages
  community.general.pacman:
    name:
      - base-devel
      - sudo
      - git
      - curl
      - wget
      - rsync
      - unzip
      - zip
      - tree
      - nano
      - vim
      - stow
      - reflector
      - inotify-tools
      - smartmontools
      - dkms
      - zram-generator
      - efibootmgr
      - imagemagick
    state: present

# ------------------------------------------------------------
# Kernels and firmware
# ------------------------------------------------------------

- name: Install kernels
  community.general.pacman:
    name: "{{ kernels }}"
    state: present

- name: Install microcode and firmware
  community.general.pacman:
    name:
      - intel-ucode
      - linux-firmware
    state: present

    # ------------------------------------------------------------
# Passwordless sudo for pacman (required for paru/AUR installs)
# ------------------------------------------------------------

- name: Allow joseph passwordless sudo for pacman
  ansible.builtin.copy:
    dest: /etc/sudoers.d/joseph-pacman
    content: "joseph ALL=(ALL) NOPASSWD: /usr/bin/pacman\n"
    mode: '0440'
    validate: 'visudo -cf %s'


# ------------------------------------------------------------
# AUR helper — paru
# ------------------------------------------------------------

- name: Check if paru is installed
  ansible.builtin.command: which paru
  register: paru_check
  changed_when: false
  failed_when: false

- name: Clone paru from AUR
  become: false
  ansible.builtin.git:
    repo: https://aur.archlinux.org/paru.git
    dest: /tmp/paru
    depth: 1
  when: paru_check.rc != 0

- name: Build and install paru
  become: false
  ansible.builtin.command:
    cmd: makepkg -si --noconfirm
    chdir: /tmp/paru
    creates: /usr/bin/paru
  when: paru_check.rc != 0



# ------------------------------------------------------------
# Locale
# ------------------------------------------------------------

- name: Set locale in locale.gen
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*{{ locale }} UTF-8'
    line: '{{ locale }} UTF-8'

- name: Generate locale
  ansible.builtin.command: locale-gen
  changed_when: false

- name: Set system locale
  ansible.builtin.copy:
    dest: /etc/locale.conf
    content: "LANG={{ locale }}\n"
    mode: '0644'

- name: Set vconsole keymap
  ansible.builtin.copy:
    dest: /etc/vconsole.conf
    content: "KEYMAP=us\n"
    mode: '0644'

# ------------------------------------------------------------
# Timezone
# ------------------------------------------------------------

- name: Set timezone
  ansible.builtin.file:
    src: /usr/share/zoneinfo/{{ timezone }}
    dest: /etc/localtime
    state: link
    force: true

- name: Sync hardware clock
  ansible.builtin.command: hwclock --systohc
  changed_when: false

# ------------------------------------------------------------
# Hostname
# ------------------------------------------------------------

- name: Set hostname
  ansible.builtin.copy:
    dest: /etc/hostname
    content: "{{ hostname }}\n"
    mode: '0644'

- name: Set /etc/hosts
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    mode: '0644'

# ------------------------------------------------------------
# Bootloader
# ------------------------------------------------------------

- name: Install GRUB
  community.general.pacman:
    name:
      - grub
    state: present
  when: bootloader == 'grub'

- name: Install rEFInd
  community.general.pacman:
    name: refind
    state: present
  when: bootloader == 'refind'

- name: Run refind-install (first-time EFI setup)
  ansible.builtin.command:
    cmd: refind-install
    creates: /boot/EFI/refind/refind_x64.efi
  when: bootloader == 'refind'

- name: Deploy refind.conf
  ansible.builtin.template:
    src: refind.conf.j2
    dest: /boot/EFI/refind/refind.conf
    mode: '0644'
  when: bootloader == 'refind'

- name: Clone rEFInd-minimal theme
  become: false
  ansible.builtin.git:
    repo: https://github.com/evanpurkhiser/rEFInd-minimal.git
    dest: /tmp/rEFInd-minimal
    depth: 1
    update: false
  when: bootloader == 'refind'

- name: Sync rEFInd-minimal theme files to ESP
  ansible.builtin.command:
    cmd: rsync -r --no-perms --no-owner --no-group --exclude=background.png --exclude='.git' /tmp/rEFInd-minimal/ /boot/EFI/refind/themes/rEFInd-minimal/
  changed_when: false
  when: bootloader == 'refind'

- name: Convert and copy rEFInd background image
  ansible.builtin.command:
    cmd: >
      convert '{{ refind_background_src }}'
      -resize 1920x1200^
      -gravity center
      -extent 1920x1200
      /boot/EFI/refind/themes/rEFInd-minimal/background.png
    creates: /boot/EFI/refind/themes/rEFInd-minimal/background.png
  when: bootloader == 'refind'

# ------------------------------------------------------------
# btrfs tools and snapper (btrfs only)
# ------------------------------------------------------------

- name: Install btrfs packages
  community.general.pacman:
    name:
      - btrfs-progs
    state: present
  when: btrfs | bool

- name: Install snapper
  community.general.pacman:
    name: snapper
    state: present
  when: btrfs | bool

# ------------------------------------------------------------
# zram swap
# ------------------------------------------------------------

- name: Configure zram-generator
  ansible.builtin.copy:
    dest: /etc/systemd/zram-generator.conf
    content: |
      [zram0]
      zram-size = ram / 2
      compression-algorithm = zstd
    mode: '0644'

# ------------------------------------------------------------
# reflector (mirror list)
# ------------------------------------------------------------

- name: Configure reflector
  ansible.builtin.copy:
    dest: /etc/xdg/reflector/reflector.conf
    content: |
      --save /etc/pacman.d/mirrorlist
      --country US
      --protocol https
      --latest 25
      --sort rate
    mode: '0644'

# ------------------------------------------------------------
# Enable the multilib repository in pacman.conf
# ------------------------------------------------------------
- name: Enable the multilib repository in pacman.conf
  community.general.ini_file:
    path: /etc/pacman.conf
    state: present
    section: multilib
    option: Include
    value: /etc/pacman.d/mirrorlist
    no_extra_spaces: yes
  become: yes

- name: Update pacman cache
  community.general.pacman:
    update_cache: yes
  become: yes
