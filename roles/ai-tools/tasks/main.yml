---
# ------------------------------------------------------------
# AI coding CLIs and desktop agents
# ------------------------------------------------------------
# Covers: Antigravity CLI (agy) · Antigravity 2.0 · Antigravity IDE · Codex CLI.
#
# ⚠️ INSTALL-IF-ABSENT, NEVER CONVERGE-TO-VERSION.
# Every tool here ships a self-updater. If these tasks asserted the pinned
# version they would DOWNGRADE a self-updated install on every playbook run.
# The guards below all key on "is the launcher present", not "is it version X".
#
# ⚠️ AUTHENTICATION IS DELIBERATELY NOT AUTOMATED.
# Driving a vendor's authenticated client from a script is a terms problem,
# not merely an inconvenient one. This role installs; the human logs in. The
# required logins are written to ~/POST-INSTALL.md by the `services` role.

# check_mode: false on every directory-creation task in this role.
#
# `unarchive` with --strip-components requires dest to be an EXISTING dir, so
# under --check the mkdir is only simulated and every extract task then fails
# with "must be an existing dir". A dry run that always fails at the same spot
# is worse than no dry run: it teaches you to skip reading them. Creating an
# empty directory is harmless and idempotent, and it is what makes --check able
# to validate the tasks that actually matter (downloads, checksums, templates).
- name: Ensure user-local install directories exist
  become: false
  check_mode: false
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ai_tools_bin }}"
    - "{{ ai_tools_opt }}"
    - "{{ ai_tools_desktop }}"

# ------------------------------------------------------------
# Antigravity CLI (agy)
# ------------------------------------------------------------

- name: Check whether Antigravity CLI is already installed
  become: false
  ansible.builtin.stat:
    path: "{{ ai_tools_bin }}/agy"
  register: agy_installed

- name: Install Antigravity CLI
  when: not agy_installed.stat.exists
  block:
    - name: Fetch the Antigravity CLI installer
      become: false
      ansible.builtin.get_url:
        url: "{{ antigravity_cli_installer }}"
        dest: /tmp/agy-install.sh
        mode: "0755"

    # The installer downloads the binary and then runs "agy install", which
    # appends a PATH export to .bashrc, .zshrc, .bash_profile AND .profile.
    # ~/.zshrc is stow-managed by the `dotfiles` role, which runs later, so a
    # file created here makes stow refuse to link. The installer used to take
    # --skip-path and --skip-aliases itself; it no longer does, but
    # "agy install" still accepts them, so they are added to that last step.
    - name: Make the installer leave shell profiles alone
      become: false
      ansible.builtin.replace:
        path: /tmp/agy-install.sh
        regexp: '("\$BINARY_PATH" install)( --dir "\$CUSTOM_DIR")? \|\| true'
        replace: '\1\2 --skip-path --skip-aliases || true'
      register: ai_tools_agy_installer_patch

    # If the installer changes shape again, stop here rather than let it edit
    # the profiles.
    - name: Check the installer was changed
      ansible.builtin.assert:
        that: ai_tools_agy_installer_patch is changed
        fail_msg: >-
          The Antigravity installer no longer ends with "agy install", so the
          flags that keep it out of shell profiles could not be added.

    - name: Run the Antigravity CLI installer
      become: false
      ansible.builtin.command:
        cmd: /tmp/agy-install.sh
        creates: "{{ ai_tools_bin }}/agy"

    - name: Remove the installer
      become: false
      ansible.builtin.file:
        path: /tmp/agy-install.sh
        state: absent

# ------------------------------------------------------------
# Antigravity 2.0 (agent orchestration desktop — no code editor)
# ------------------------------------------------------------

- name: Check whether Antigravity 2.0 is already installed
  become: false
  ansible.builtin.stat:
    path: "{{ ai_tools_opt }}/antigravity/antigravity"
  register: antigravity_hub_installed

- name: Install Antigravity 2.0
  when: not antigravity_hub_installed.stat.exists
  block:
    - name: Download the Antigravity 2.0 tarball
      become: false
      ansible.builtin.get_url:
        url: "{{ antigravity_hub_url }}"
        dest: /tmp/antigravity-hub.tar.gz
        checksum: "sha256:{{ antigravity_hub_sha256 }}"
        mode: "0644"

    - name: Create the Antigravity 2.0 install directory
      become: false
      check_mode: false
      ansible.builtin.file:
        path: "{{ ai_tools_opt }}/antigravity"
        state: directory
        mode: "0755"

    # The archive's top level is "Antigravity-x64/"; strip it so the install
    # path is a stable lowercase name we control rather than a vendor string
    # that changes with the architecture.
    - name: Extract Antigravity 2.0
      become: false
      ansible.builtin.unarchive:
        src: /tmp/antigravity-hub.tar.gz
        dest: "{{ ai_tools_opt }}/antigravity"
        remote_src: true
        extra_opts:
          - --strip-components=1

    - name: Remove the Antigravity 2.0 tarball
      become: false
      ansible.builtin.file:
        path: /tmp/antigravity-hub.tar.gz
        state: absent

# ------------------------------------------------------------
# Antigravity IDE (the editor — a separate product from 2.0)
# ------------------------------------------------------------

- name: Check whether Antigravity IDE is already installed
  become: false
  ansible.builtin.stat:
    path: "{{ ai_tools_opt }}/antigravity-ide/antigravity-ide"
  register: antigravity_ide_installed

- name: Install Antigravity IDE
  when: not antigravity_ide_installed.stat.exists
  block:
    - name: Download the Antigravity IDE tarball
      become: false
      ansible.builtin.get_url:
        url: "{{ antigravity_ide_url }}"
        dest: /tmp/antigravity-ide.tar.gz
        checksum: "sha256:{{ antigravity_ide_sha256 }}"
        mode: "0644"

    - name: Create the Antigravity IDE install directory
      become: false
      check_mode: false
      ansible.builtin.file:
        path: "{{ ai_tools_opt }}/antigravity-ide"
        state: directory
        mode: "0755"

    # Top level is "Antigravity IDE/" — with a space. Stripping it removes the
    # need to quote this path anywhere downstream.
    - name: Extract Antigravity IDE
      become: false
      ansible.builtin.unarchive:
        src: /tmp/antigravity-ide.tar.gz
        dest: "{{ ai_tools_opt }}/antigravity-ide"
        remote_src: true
        extra_opts:
          - --strip-components=1

    - name: Remove the Antigravity IDE tarball
      become: false
      ansible.builtin.file:
        path: /tmp/antigravity-ide.tar.gz
        state: absent

# ------------------------------------------------------------
# Launchers on PATH
# ------------------------------------------------------------
# For the IDE this links bin/antigravity-ide, not the top-level binary: the
# bin/ entry is the VS Code-style CLI wrapper meant for terminal use
# (`antigravity-ide .`), while the top-level binary is what the desktop entry
# launches.

- name: Link launchers onto PATH
  become: false
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: "{{ ai_tools_opt }}/antigravity/antigravity"
      dest: "{{ ai_tools_bin }}/antigravity"
    - src: "{{ ai_tools_opt }}/antigravity-ide/bin/antigravity-ide"
      dest: "{{ ai_tools_bin }}/antigravity-ide"

# ------------------------------------------------------------
# Desktop entries
# ------------------------------------------------------------

- name: Install desktop entries
  become: false
  ansible.builtin.template:
    src: "{{ item }}.desktop.j2"
    dest: "{{ ai_tools_desktop }}/{{ item }}.desktop"
    mode: "0644"
  loop:
    - antigravity
    - antigravity-ide

# ------------------------------------------------------------
# ChatGPT desktop (OpenAI's own pacman repository)
# ------------------------------------------------------------
# chatgpt-bin is not in the Arch repositories or the AUR as a signed build;
# OpenAI publishes it in a repository of its own. The package's install
# script would add that repository and its key by itself, but only once the
# package is installed, so on a fresh machine the playbook has to do it first.
# What is written here is byte-for-byte what that script writes, so it adopts
# the configuration rather than replacing it.

- name: Check whether the OpenAI repository key is trusted
  ansible.builtin.command:
    cmd: pacman-key --list-keys {{ ai_tools_chatgpt_key_fingerprint }}
  register: ai_tools_chatgpt_key
  changed_when: false
  failed_when: false

- name: Trust the OpenAI repository key
  when: ai_tools_chatgpt_key.rc != 0
  block:
    - name: Copy the OpenAI repository key
      ansible.builtin.copy:
        src: openai-chatgpt.asc
        dest: /tmp/openai-chatgpt.asc
        mode: "0644"

    # The key file is in this repository, so check it is the key it claims to
    # be before it becomes something pacman trusts.
    - name: Read the fingerprint of the copied key
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          gpg --batch --show-keys --with-colons /tmp/openai-chatgpt.asc |
          awk -F: '$1 == "fpr" { print $10; exit }'
        executable: /bin/bash
      register: ai_tools_chatgpt_key_file
      changed_when: false

    - name: Stop if the key is not the expected one
      ansible.builtin.assert:
        that: ai_tools_chatgpt_key_file.stdout == ai_tools_chatgpt_key_fingerprint
        fail_msg: The OpenAI repository key in this role does not have the expected fingerprint.

    - name: Add the OpenAI repository key to the pacman keyring
      ansible.builtin.command:
        cmd: pacman-key --add /tmp/openai-chatgpt.asc
      changed_when: true

    - name: Sign the OpenAI repository key locally
      ansible.builtin.command:
        cmd: pacman-key --lsign-key {{ ai_tools_chatgpt_key_fingerprint }}
      changed_when: true

    - name: Remove the copied key
      ansible.builtin.file:
        path: /tmp/openai-chatgpt.asc
        state: absent

- name: Configure the OpenAI repository
  ansible.builtin.copy:
    dest: /etc/pacman.d/openai-chatgpt.conf
    mode: "0644"
    content: |
      ### THIS FILE IS AUTOMATICALLY CONFIGURED ###
      # Remove it and its Include line to opt out of automatic package updates.
      [openai-chatgpt]
      SigLevel = Required DatabaseRequired TrustedOnly
      Server = https://persistent.oaistatic.com/codex-app-prod/linux/arch/$arch
  register: ai_tools_chatgpt_repo

- name: Include the OpenAI repository in pacman.conf
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    line: Include = /etc/pacman.d/openai-chatgpt.conf
  register: ai_tools_chatgpt_include

- name: Install ChatGPT desktop
  community.general.pacman:
    name: chatgpt-bin
    state: present
    update_cache: "{{ ai_tools_chatgpt_repo is changed or ai_tools_chatgpt_include is changed }}"

# ------------------------------------------------------------
# OpenCode and Hermes
# ------------------------------------------------------------

- name: Install OpenCode
  community.general.pacman:
    name: opencode
    state: present

- name: Install the OpenCode and Hermes desktop apps
  become: false
  kewlfft.aur.aur:
    name:
      - opencode-desktop
      - hermes-agent-desktop
    state: present
    use: paru

# ------------------------------------------------------------
# Codex CLI
# ------------------------------------------------------------
# Installed globally with the system npm (matching dev-tools' npm task, which
# also runs under the play-level become), landing in /usr/lib/node_modules.
#
# ⚠️ The scoped name matters. The unscoped `codex` on npm is an unrelated 2012
# package; installing it is the most common Codex setup failure.
#
# ⚠️ Do NOT reintroduce a wrapper shim at ~/.local/bin/codex. One existed until
# 2026-08-08, injecting a bootstrap prompt that told Codex to read Claude's
# memory files on every invocation. That bridge was retired: one tool's
# memory is not the other's to read.

- name: Install global AI npm packages
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: present
  loop: "{{ ai_tools_npm_packages }}"
