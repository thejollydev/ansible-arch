---
- name: Install shell packages
  community.general.pacman:
    name:
      - zsh
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - starship
    state: present

- name: Set zsh as the workstation user's default shell
  ansible.builtin.user:
    name: "{{ workstation_user }}"
    shell: /bin/zsh
