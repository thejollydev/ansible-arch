---
# AI Workspace system: the `aiw` CLI, the OKF validators, the shared agent
# skills, and the knowledge vault they operate on.
aiw_user: joseph
aiw_home_dir: /home/joseph

aiw_repo: git@github.com:thejollydev/ai-workspace.git
aiw_repo_dest: /home/joseph/Projects/ai-workspace

# The vault is a separate private repo. Cloned only when absent (update: false),
# never pulled by the playbook — it also syncs continuously via obsidian-git,
# and a playbook pull would race that.
aiw_vault_repo: git@github.com:thejollydev/Knowledge-OKF-Vault.git
aiw_vault_dest: /home/joseph/Vaults/Knowledge
aiw_clone_vault: true

# worktree = deploy a detached git worktree of origin/main at AIW_HOME; the
#            live system moves only on merge + redeploy, never with the dev
#            branch. Correct for every machine that keeps the repo.
# copy     = independent copy; only for a box that will not hold the checkout.
aiw_install_mode: worktree
