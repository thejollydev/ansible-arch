---
- name: Install networking packages
  community.general.pacman:
    name:
      - networkmanager
      - network-manager-applet
      - wireguard-tools
      - nss-mdns
      - avahi
      - bind
      - systemd-resolvconf
    state: present

- name: Install WiFi packages
  community.general.pacman:
    name:
      - iwd
      - wireless_tools
    state: present
  when: wifi | bool
# ------------------------------------------------------------
# One resolver, asked once (BezaForge #663)
# ------------------------------------------------------------
# NetworkManager ran in its default DNS mode, writing /etc/resolv.conf
# itself, while ALSO pushing each connection's servers into
# systemd-resolved (its systemd-resolved=true default). resolved imported
# the NM-written file as a second, Global server list, so every name went
# out on two scopes: A and AAAA on each, four queries per name. A busy
# page then burst past AdGuard's per-device rate limit, resolved took the
# drops for a dead server and moved to dnsmasq (2026-09-26).
#
# dns=systemd-resolved plus the stub resolv.conf leaves one scope per
# connection. Nothing needed the plain file: glibc already resolves
# through resolved (nsswitch `resolve`), Docker reads
# /run/systemd/resolve/resolv.conf when it sees the stub, and
# systemd-resolvconf (wg-quick) talks to resolved directly.
#
# ⚠️ Docker decides that ONCE, when the daemon starts. A daemon that was
# already running when resolv.conf became the stub keeps reading
# /etc/resolv.conf, finds only 127.0.0.53, drops it as localhost and
# gives every new container 8.8.8.8/8.8.4.4 — off AdGuard, blind to
# *.bezaforge.dev (seen 2026-09-26). Restart docker once after the
# switch. A fresh boot is fine: docker starts after the stub exists.
- name: Hand DNS to systemd-resolved in NetworkManager
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/10-dns-systemd-resolved.conf
    content: |
      # Managed by ansible-arch roles/networking (BezaForge #663)
      [main]
      dns=systemd-resolved
    owner: root
    group: root
    mode: '0644'
  notify: Reload NetworkManager
  when: networking_dns_manage | bool

- name: Point /etc/resolv.conf at the systemd-resolved stub
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when: networking_dns_manage | bool

# ------------------------------------------------------------
# DNS resilience on the home network (BezaForge #638)
# ------------------------------------------------------------
# See defaults/main.yml for the rationale: why this is per-connection
# rather than NetworkManager [global-dns], and why the search domain
# must be set alongside the servers.
- name: Configure resilient DNS on home + VPN profiles
  when: networking_dns_manage | bool
  block:

    - name: List NetworkManager connections
      ansible.builtin.command:
        cmd: nmcli -t -f UUID,NAME connection show
      register: networking_nm_conns
      changed_when: false
      # NM connection names are not unique — this laptop had two profiles
      # named "The Bunker" until the stale one was deleted 2026-08-09, which
      # made `nmcli con mod "The Bunker"` ambiguous and warn. Profiles are
      # addressed by UUID and EVERY match is updated, so a duplicate that
      # reappears is covered rather than silently half-configured.

    - name: Select the UUIDs of the managed connections
      ansible.builtin.set_fact:
        networking_dns_uuids: >-
          {{ networking_nm_conns.stdout_lines
             | map('split', ':')
             | selectattr('1', 'in', _names)
             | map(attribute=0) | list }}
      vars:
        _names: "{{ networking_dns_connections | map(attribute='name') }}"

    - name: Report how many profiles matched
      ansible.builtin.debug:
        msg: >-
          {{ networking_dns_uuids | length }} profile(s) matched
          {{ networking_dns_connections | map(attribute='name') | list }}
      # A silent zero-match looks exactly like success. If this reports 0,
      # the names in defaults no longer match reality.

    - name: Read current DNS settings per profile
      ansible.builtin.command:
        cmd: >-
          nmcli --escape no -g
          ipv4.dns,ipv4.dns-search,ipv4.dns-options,ipv4.ignore-auto-dns
          connection show {{ item }}
      loop: "{{ networking_dns_uuids }}"
      register: networking_dns_current
      changed_when: false
      # ⚠️ `--escape no` is LOAD-BEARING. In terse mode `:` is the field
      # separator, so nmcli escapes literal colons in values and returns
      # `timeout\:2,attempts\:1`. Comparing that against the unescaped
      # desired value never matches, so this task reported `changed` on
      # every run and the role could never be a no-op. Caught 2026-08-09
      # on the first real run — the values were already correct and it
      # still claimed to change them.

    - name: Apply DNS settings only where they differ
      ansible.builtin.command:
        cmd: >-
          nmcli connection modify {{ item.item }}
          ipv4.dns "{{ networking_dns_servers | join(',') }}"
          ipv4.dns-search "{{ networking_dns_search }}"
          ipv4.dns-options "{{ networking_dns_options }}"
          ipv4.ignore-auto-dns {{ 'yes' if _ignore else 'no' }}
      vars:
        _name: >-
          {{ (networking_nm_conns.stdout_lines
              | select('search', '^' ~ item.item ~ ':')
              | first).split(':')[1] }}
        _ignore: >-
          {{ (networking_dns_connections
              | selectattr('name', 'equalto', _name)
              | first).ignore_auto_dns | bool }}
        _desired:
          - "{{ networking_dns_servers | join(',') }}"
          - "{{ networking_dns_search }}"
          - "{{ networking_dns_options }}"
          - "{{ 'yes' if _ignore else 'no' }}"
      loop: "{{ networking_dns_current.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stdout_lines != _desired
      changed_when: true
      notify: Reapply networkmanager connection
      # `nmcli con mod` always exits 0 whether or not it changed anything,
      # so the `when:` comparison is what keeps this honest — without it
      # every run reports changed and the play is never a true no-op.
      # `changed_when: true` is therefore correct: the task only runs at
      # all when the live settings already differ from the desired ones.

# ------------------------------------------------------------
# Staying on AdGuard (BezaForge #663)
# ------------------------------------------------------------
# See defaults/main.yml. `bind` (installed above) provides dig, which the
# failback needs to ask AdGuard directly rather than through resolved.
- name: Keep the resolver on AdGuard
  when: networking_dns_manage | bool and networking_dns_monitor | bool
  block:

    - name: Deploy the primary-DNS check script
      ansible.builtin.template:
        src: dns-primary-check.sh.j2
        dest: /usr/local/bin/bezaforge-dns-primary-check.sh
        owner: root
        group: root
        mode: '0755'

    - name: Deploy the primary-DNS check service and timer
      ansible.builtin.template:
        src: "dns-primary-check.{{ item }}.j2"
        dest: "/etc/systemd/system/bezaforge-dns-primary-check.{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - service
        - timer
      notify: Reload systemd for the DNS check

    - name: Flush handlers so the units exist before the timer is enabled
      ansible.builtin.meta: flush_handlers

    - name: Enable and start the primary-DNS check timer
      ansible.builtin.systemd:
        name: bezaforge-dns-primary-check.timer
        enabled: true
        state: started

    - name: Run the check once now so the metric exists immediately
      ansible.builtin.command: /usr/local/bin/bezaforge-dns-primary-check.sh
      register: networking_dns_check
      changed_when: "'restarting systemd-resolved' in networking_dns_check.stdout"
