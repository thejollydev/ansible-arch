---
- name: Install networking packages
  community.general.pacman:
    name:
      - networkmanager
      - network-manager-applet
      - wireguard-tools
      - nss-mdns
      - avahi
      - bind
      - systemd-resolvconf
    state: present

- name: Install WiFi packages
  community.general.pacman:
    name:
      - iwd
      - iw
      - wireless_tools
      - wireless-regdb
      - wpa_supplicant
    state: present
  when: wifi | bool

# ------------------------------------------------------------
# Wi-Fi regulatory domain
# ------------------------------------------------------------
# See defaults/main.yml for why. wireless-regdb ships the kernel's
# regulatory.db, /etc/conf.d/wireless-regdom with every country commented
# out, and a udev rule that runs set-wireless-regdom (which reads that
# file and calls `iw reg set`) whenever cfg80211 loads. So the file is
# what holds the setting across boots, and `iw reg set` below only saves
# waiting for the next boot.
- name: Set the Wi-Fi regulatory domain
  when: wifi | bool
  block:

    - name: Check the regulatory domain is a country code
      ansible.builtin.assert:
        that: networking_wifi_regdom is match('^([A-Z]{2}|00)$')
        fail_msg: >-
          networking_wifi_regdom is '{{ networking_wifi_regdom }}', not a
          two-letter ISO 3166 code in capitals (or 00 for the world domain).
        quiet: true

    # Uncommented line replaced if there is one, appended if not. The
    # packaged file's ~180 commented-out countries are left alone, so a
    # changed country edits one line rather than adding a second.
    - name: Write the regulatory domain to /etc/conf.d/wireless-regdom
      ansible.builtin.lineinfile:
        path: /etc/conf.d/wireless-regdom
        regexp: '^WIRELESS_REGDOM='
        line: 'WIRELESS_REGDOM="{{ networking_wifi_regdom }}"'
        owner: root
        group: root
        mode: '0644'

    # sysfs has one entry per wireless device (phy0, ...). A host with the
    # wifi flag on and no card (a VM, a card that is switched off at the
    # hardware) keeps the file for when one appears, but has no cfg80211
    # domain to set now.
    - name: Look for a wireless device
      ansible.builtin.find:
        paths: /sys/class/ieee80211
        file_type: any
      register: networking_wifi_phys

    - name: Apply the regulatory domain now
      when: networking_wifi_phys.matched > 0
      block:

        - name: Read the current regulatory domain
          ansible.builtin.command:
            cmd: iw reg get
          register: networking_wifi_regdom_before
          changed_when: false
          check_mode: false
          # Read-only. It runs in --check so the next task can say whether
          # an apply would change the domain, rather than skipping silently.

        # Only the "global" section is compared. An Intel card shows a
        # second, self-managed "phy#0" section that follows the global
        # domain on its own and reports DFS-UNSET; `iw reg set` cannot set
        # it directly.
        - name: Set the regulatory domain in the kernel
          ansible.builtin.command:
            cmd: iw reg set {{ networking_wifi_regdom }}
          when: _current != networking_wifi_regdom
          changed_when: true
          vars:
            _current: >-
              {{ networking_wifi_regdom_before.stdout
                 | regex_findall('^global\s+country (\w+):')
                 | first | default('') }}

        - name: Check the kernel reports the regulatory domain
          ansible.builtin.command:
            cmd: iw reg get
          register: networking_wifi_regdom_after
          changed_when: false
          # The kernel applies `iw reg set` asynchronously, so a read
          # straight after it can still show the old domain.
          until: >-
            networking_wifi_regdom_after.stdout
            is search('^global\s+country ' ~ networking_wifi_regdom ~ ':')
          retries: 5
          delay: 2

# ------------------------------------------------------------
# One resolver, asked once
# ------------------------------------------------------------
# NetworkManager ran in its default DNS mode, writing /etc/resolv.conf
# itself, while ALSO pushing each connection's servers into
# systemd-resolved (its systemd-resolved=true default). resolved imported
# the NM-written file as a second, Global server list, so every name went
# out on two scopes: A and AAAA on each, four queries per name. A busy
# page then burst past the primary's per-device rate limit, resolved took
# the drops for a dead server and moved to the secondary (2026-09-26).
#
# dns=systemd-resolved plus the stub resolv.conf leaves one scope per
# connection. Nothing needed the plain file: glibc already resolves
# through resolved (nsswitch `resolve`), Docker reads
# /run/systemd/resolve/resolv.conf when it sees the stub, and
# systemd-resolvconf (wg-quick) talks to resolved directly.
#
# ⚠️ Docker decides that ONCE, when the daemon starts. A daemon that was
# already running when resolv.conf became the stub keeps reading
# /etc/resolv.conf, finds only 127.0.0.53, drops it as localhost and
# gives every new container 8.8.8.8/8.8.4.4 — off the primary, blind to
# the internal zone (seen 2026-09-26). Restart docker once after the
# switch. A fresh boot is fine: docker starts after the stub exists.
- name: Hand DNS to systemd-resolved in NetworkManager
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/10-dns-systemd-resolved.conf
    content: |
      # Managed by ansible-arch roles/networking
      [main]
      dns=systemd-resolved
    owner: root
    group: root
    mode: '0644'
  notify: Reload NetworkManager
  when: networking_dns_manage | bool

- name: Point /etc/resolv.conf at the systemd-resolved stub
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when: networking_dns_manage | bool

# ------------------------------------------------------------
# DNS resilience on the home network
# ------------------------------------------------------------
# See defaults/main.yml for the rationale: why this is per-connection
# rather than NetworkManager [global-dns], and why the search domain
# must be set alongside the servers.
- name: Configure resilient DNS on home + VPN profiles
  when: networking_dns_manage | bool and networking_dns_connections | length > 0
  block:

    - name: Check there are servers to give the managed profiles
      ansible.builtin.assert:
        that: networking_dns_servers | length > 0
        fail_msg: >-
          networking_dns_connections names profiles but networking_dns_servers
          is empty, which would leave those profiles with no DNS at all.
        quiet: true

    - name: List NetworkManager connections
      ansible.builtin.command:
        cmd: nmcli -t -f UUID,NAME connection show
      register: networking_nm_conns
      changed_when: false
      # NM connection names are not unique — this laptop had two home-WiFi
      # profiles with the same name until the stale one was deleted
      # 2026-08-09, which made a name-only `nmcli con mod` ambiguous and
      # warn. Profiles are
      # addressed by UUID and EVERY match is updated, so a duplicate that
      # reappears is covered rather than silently half-configured.

    - name: Select the UUIDs of the managed connections
      ansible.builtin.set_fact:
        networking_dns_uuids: >-
          {{ networking_nm_conns.stdout_lines
             | map('split', ':')
             | selectattr('1', 'in', _names)
             | map(attribute=0) | list }}
      vars:
        _names: "{{ networking_dns_connections | map(attribute='name') }}"

    - name: Report how many profiles matched
      ansible.builtin.debug:
        msg: >-
          {{ networking_dns_uuids | length }} profile(s) matched
          {{ networking_dns_connections | map(attribute='name') | list }}
      # A silent zero-match looks exactly like success. If this reports 0,
      # the configured names no longer match reality.

    - name: Read current DNS settings per profile
      ansible.builtin.command:
        cmd: >-
          nmcli --escape no -g
          ipv4.dns,ipv4.dns-search,ipv4.dns-options,ipv4.ignore-auto-dns
          connection show {{ item }}
      loop: "{{ networking_dns_uuids }}"
      register: networking_dns_current
      changed_when: false
      # ⚠️ `--escape no` is LOAD-BEARING. In terse mode `:` is the field
      # separator, so nmcli escapes literal colons in values and returns
      # `timeout\:2,attempts\:1`. Comparing that against the unescaped
      # desired value never matches, so this task reported `changed` on
      # every run and the role could never be a no-op. Caught 2026-08-09
      # on the first real run — the values were already correct and it
      # still claimed to change them.

    - name: Apply DNS settings only where they differ
      ansible.builtin.command:
        cmd: >-
          nmcli connection modify {{ item.item }}
          ipv4.dns "{{ networking_dns_servers | join(',') }}"
          ipv4.dns-search "{{ networking_dns_search }}"
          ipv4.dns-options "{{ networking_dns_options }}"
          ipv4.ignore-auto-dns {{ 'yes' if _ignore else 'no' }}
      vars:
        _name: >-
          {{ (networking_nm_conns.stdout_lines
              | select('search', '^' ~ item.item ~ ':')
              | first).split(':')[1] }}
        _ignore: >-
          {{ (networking_dns_connections
              | selectattr('name', 'equalto', _name)
              | first).ignore_auto_dns | bool }}
        _desired:
          - "{{ networking_dns_servers | join(',') }}"
          - "{{ networking_dns_search }}"
          - "{{ networking_dns_options }}"
          - "{{ 'yes' if _ignore else 'no' }}"
      loop: "{{ networking_dns_current.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stdout_lines != _desired
      changed_when: true
      notify: Reapply networkmanager connection
      # `nmcli con mod` always exits 0 whether or not it changed anything,
      # so the `when:` comparison is what keeps this honest — without it
      # every run reports changed and the play is never a true no-op.
      # `changed_when: true` is therefore correct: the task only runs at
      # all when the live settings already differ from the desired ones.

# ------------------------------------------------------------
# Staying on the primary
# ------------------------------------------------------------
# See defaults/main.yml. `bind` (installed above) provides dig, which the
# failback needs to ask the primary directly rather than through resolved.
- name: Keep the resolver on the primary
  when: >-
    networking_dns_manage | bool and networking_dns_monitor | bool
    and networking_dns_servers | length > 0
  block:

    - name: Deploy the primary-DNS check script
      ansible.builtin.template:
        src: dns-primary-check.sh.j2
        dest: /usr/local/bin/bezaforge-dns-primary-check.sh
        owner: root
        group: root
        mode: '0755'

    - name: Deploy the primary-DNS check service and timer
      ansible.builtin.template:
        src: "dns-primary-check.{{ item }}.j2"
        dest: "/etc/systemd/system/bezaforge-dns-primary-check.{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - service
        - timer
      notify: Reload systemd for the DNS check

    - name: Flush handlers so the units exist before the timer is enabled
      ansible.builtin.meta: flush_handlers

    - name: Enable and start the primary-DNS check timer
      ansible.builtin.systemd:
        name: bezaforge-dns-primary-check.timer
        enabled: true
        state: started

    - name: Run the check once now so the metric exists immediately
      ansible.builtin.command: /usr/local/bin/bezaforge-dns-primary-check.sh
      register: networking_dns_check
      changed_when: "'restarting systemd-resolved' in networking_dns_check.stdout"
