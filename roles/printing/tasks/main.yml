---
- name: Install printing packages
  community.general.pacman:
    name:
      - cups
      - cups-pdf
      - cups-pk-helper
      - system-config-printer
      - ipp-usb
      - sane-airscan
    state: present
  when: printing | bool

# Canon TR4700: Do NOT install cnijfilter2 or canon-pixma-lt7500-complete.
# Use CUPS web UI (localhost:631) with IPP Everywhere driver instead.
# See: 02_Knowledge-Base/Quick-References/Linux/canon-tr4700-printer-setup.md