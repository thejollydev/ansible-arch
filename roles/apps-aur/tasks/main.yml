---
- name: Install AUR applications
  become: false
  kewlfft.aur.aur:
    name:
      - bitwarden-bin
      - google-chrome
      - visual-studio-code-bin
      - jetbrains-toolbox
      - slack-desktop
      - zoom
      - notion-app-electron
      - postman-bin
      - gitkraken
      - gitnuro-bin
      - losslesscut-bin
      - webex-bin
      - immersed
      - playtorrio-bin
      - sysd-manager
      - catt
      - google-cloud-cli
      - ttf-google-fonts-typewolf
      # Claude Desktop. It downloads and updates its own copy of Claude Code
      # for the sessions it runs, so there is no separate installer.
      - claude-desktop-extra
    state: present
    use: paru
