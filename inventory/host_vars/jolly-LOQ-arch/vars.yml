---
# Connection
ansible_connection: local

# Machine identity
hostname: jolly-LOQ-arch
timezone: America/Detroit
locale: en_US.UTF-8

# Private values come from vault.yml beside this file, which is encrypted
# with ansible-vault. Applies need --ask-vault-pass; --syntax-check and
# --list-tasks do not. See vault.yml.example for the names it must define.
workstation_user: "{{ vault_workstation_user }}"
workstation_home: "/home/{{ workstation_user }}"

# DNS on the home network and the VPN (roles/networking)
networking_dns_servers: "{{ vault_networking_dns_servers }}"
networking_dns_search: "{{ vault_networking_dns_search }}"
networking_dns_connections: "{{ vault_networking_dns_connections }}"

# Kernels (the default boot entry is grub_default_kernel, below)
kernels:
  - linux-zen
  - linux-zen-headers
  - linux-lts
  - linux-lts-headers
  - linux-hardened
  - linux-hardened-headers
  - linux
  - linux-headers

# Feature flags
ai_tools: true
gpu_nvidia: true
hyprland: true
bluetooth: true
wifi: true
displaylink: true
ios_tools: true
printing: true
insync: true
syncthing: true
remote_desktop: false
winboat: true
node_exporter: true   # textfile collector only, for the primary-DNS metric
plymouth: true
btrfs: true

# Bootloader. GRUB loads kernels from /boot inside the btrfs root; the EFI
# partition is mounted at /efi.
bootloader: grub
grub_default_kernel: linux-zen   # top entry in the menu
grub_cmdline_default: "zswap.enabled=0 nvidia.NVreg_EnableBacklightHandler=1"
grub_os_prober: true             # this machine also boots another OS

# Dotfiles stow packages
dotfiles_packages:
  - zsh
  - git
  - starship
  - kitty
  - zellij
  - nvim
  - claude
  - systemd
  - bin
# Stowed with --no-folding: only the files in the package are linked, never a
# directory. Antigravity writes runtime state beside config/mcp_config.json,
# and a folded ~/.gemini/config link would put that state in the repo.
dotfiles_packages_no_folding:
  - gemini
