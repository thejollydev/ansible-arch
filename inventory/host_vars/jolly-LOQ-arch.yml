---
# Connection
ansible_connection: local

# Machine identity
hostname: jolly-LOQ-arch
timezone: America/Detroit
locale: en_US.UTF-8

# Kernels (first in list = default boot entry)
kernels:
  - linux-zen
  - linux-zen-headers
  - linux-lts
  - linux-lts-headers
  - linux-hardened
  - linux-hardened-headers
  - linux
  - linux-headers

# Feature flags
ai_tools: true
gpu_nvidia: true
hyprland: true
bluetooth: true
wifi: true
displaylink: true
ios_tools: true
printing: true
insync: true
syncthing: true
remote_desktop: false
winboat: true
node_exporter: false
plymouth: true
btrfs: true

# Bootloader
bootloader: refind
refind_default_selection: arch-linux-zen
refind_background_src: /home/joseph/GoogleDrive/Pictures/Wallpapers/pexels-mart-production-7577898.jpg

# Dotfiles stow packages
dotfiles_packages:
  - zsh
  - git
  - starship
  - kitty
  - zellij
  - nvim
  - claude
  - systemd
  - bin
# Stowed with --no-folding: only the files in the package are linked, never a
# directory. Antigravity writes runtime state beside config/mcp_config.json,
# and a folded ~/.gemini/config link would put that state in the repo (#792).
dotfiles_packages_no_folding:
  - gemini
