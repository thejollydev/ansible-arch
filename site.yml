---
- name: Configure Arch Linux workstation
  hosts: workstations
  become: true

  roles:
    - role: base
      tags: base
    - role: networking
      tags: networking
    - role: bluetooth
      tags: bluetooth
    - role: audio
      tags: audio
    - role: gpu-nvidia
      tags: gpu-nvidia
    - role: desktop-kde
      tags: desktop-kde
    - role: desktop-hyprland
      tags: desktop-hyprland
    - role: shell
      tags: shell
    - role: terminal
      tags: terminal
    - role: editor
      tags: editor
    - role: dev-tools
      tags: dev-tools
    - role: ai-tools
      tags: ai-tools
      when: ai_tools | bool
    - role: apps
      tags: apps
    - role: apps-aur
      tags: apps-aur
    - role: aur-audit
      tags: aur-audit
    - role: winboat
      tags: winboat
      when: winboat | bool
    - role: printing
      tags: printing
    - role: hardware
      tags: hardware
    - role: insync
      tags: insync
    # remote-desktop (XRDP) is being phased out. Standardized choice for
    # GNOME hosts is `gnome-remote-desktop` (installed at the distro level on
    # those hosts, not via this role).
    - role: remote-desktop
      tags: remote-desktop
    - role: syncthing
      tags: syncthing
      when: syncthing | bool
    - role: dotfiles
      tags: dotfiles
    # After dotfiles: stow owns harness configuration, this role owns system
    # behaviour (aiw CLI, OKF validators, shared agent skills).
    - role: ai-workspace
      tags: ai-workspace
    - role: services
      tags: services
